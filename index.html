<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>CABT Battle Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@500&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const storedPreference = localStorage.getItem('cabt.theme');
          const preference = storedPreference === 'dark' || storedPreference === 'light' || storedPreference === 'system'
            ? storedPreference
            : 'dark';
          const theme = preference === 'dark' || preference === 'light'
            ? preference
            : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
          document.documentElement.style.colorScheme = theme;
          // スキンは「大会放送」のみ（旧スキンの保存値が残っていても無視する）
          document.documentElement.dataset.skin = 'broadcast';
        } catch {
          document.documentElement.dataset.theme = 'dark';
          document.documentElement.dataset.themePreference = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
